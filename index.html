<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทำเนียบสภานักเรียน | วัดนาปรังวิทยา</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Thai',sans-serif;background:#f3f7fc;color:#14233b}header{background:linear-gradient(135deg,#0c3564,#2374c5);color:#fff;padding:55px 20px;text-align:center}header h1{font-size:42px;margin:10px 0}header p{margin:6px 0;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.panel,.card{background:#fff;border-radius:18px;box-shadow:0 8px 25px #17385c12;border:1px solid #e3eaf3}.panel{padding:22px;margin-bottom:30px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:13px;border:1px solid #ccd7e5;border-radius:10px;font-size:15px}button{border:0;border-radius:10px;padding:12px 17px;background:#16589b;color:white;font-weight:bold;cursor:pointer;margin-top:12px}button.alt{background:#edf4fb;color:#16589b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eaf0f7}.body{padding:15px}.role{font-size:12px;color:#b27a16;font-weight:bold}.name{font-size:18px;font-weight:bold;margin:5px 0}.muted{font-size:12px;color:#718096}.empty{text-align:center;padding:40px;color:#718096;grid-column:1/-1}.hint{font-size:12px;color:#66758a;margin-top:8px}.status{margin-top:10px;color:#197044;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}header h1{font-size:30px}}
</style></head><body>
<header><div>STUDENT COUNCIL DIRECTORY</div><h1>ทำเนียบสภานักเรียน</h1><p>โรงเรียนวัดนาปรังวิทยา จังหวัดพะเยา</p><p>ปีการศึกษา 2569</p></header>
<main class="wrap"><section class="panel"><h2>⚙️ เพิ่มสมาชิก</h2><div class="row"><input id="name" placeholder="ชื่อ - นามสกุล"><input id="role" placeholder="ตำแหน่ง"></div><input id="drive" style="margin-top:12px" placeholder="วางลิงก์รูปจาก Google Drive ที่นี่"><div class="hint">ตัวอย่าง: https://drive.google.com/file/d/รหัสไฟล์/view?usp=sharing</div><button onclick="add()">＋ เพิ่มสมาชิก</button><div id="status" class="status"></div></section>
<section><h2>👥 คณะกรรมการสภานักเรียน</h2><div id="grid" class="grid"></div></section></main>
<script>
const KEY='wanaprang_student_council';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[];
function driveToImg(url){let m=url.match(/\/d\/([\w-]+)/)||url.match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':url}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function add(){let n=document.getElementById('name').value.trim(),r=document.getElementById('role').value.trim(),d=document.getElementById('drive').value.trim();if(!n||!r||!d){alert('กรุณากรอกชื่อ ตำแหน่ง และลิงก์ Google Drive');return}data.push({n,r,d});save();document.getElementById('name').value='';document.getElementById('role').value='';document.getElementById('drive').value='';document.getElementById('status').textContent='✓ เพิ่มสมาชิกแล้ว'}
function edit(i){let n=prompt('แก้ชื่อ',data[i].n);if(n===null)return;let r=prompt('แก้ตำแหน่ง',data[i].r);if(r===null)return;let d=prompt('แก้ลิงก์ Google Drive',data[i].d);if(d===null)return;data[i]={n:n.trim()||data[i].n,r:r.trim()||data[i].r,d:d.trim()||data[i].d};save()}
function del(i){if(confirm('ลบสมาชิกคนนี้หรือไม่?')){data.splice(i,1);save()}}
function render(){let g=document.getElementById('grid');g.innerHTML=data.length?data.map((x,i)=>`<article class="card"><img src="${driveToImg(x.d)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22%3E%3Crect width=%22600%22 height=%22600%22 fill=%22%23eaf0f7%22/%3E%3Ctext x=%22300%22 y=%22320%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22%2316589b%22%3EPHOTO%3C/text%3E%3C/svg%3E'"><div class="body"><div class="role">${x.r}</div><div class="name">${x.n}</div><div class="muted">คณะกรรมการสภานักเรียน</div><button class="alt" onclick="edit(${i})">✏️ แก้ไข</button> <button class="alt" onclick="del(${i})">🗑️ ลบ</button></div></article>`).join(''):'<div class="empty">ยังไม่มีสมาชิก — เพิ่มข้อมูลจากด้านบนได้เลย</div>'}
render();
</script></body></html>
